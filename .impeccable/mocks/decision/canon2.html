<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F2F4F2;font-family:-apple-system,system-ui,sans-serif;color:#1B1B1B}
.lt{font-size:34px;font-weight:700;padding:60px 20px 8px}
.hero{margin:0 16px;background:#fff;border-radius:22px;padding:22px;text-align:center}
.disc{width:200px;height:200px;border-radius:50%;background:#E7F4EA;margin:0 auto;position:relative}
.disc svg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%)}
.s{font-size:28px;font-weight:700;margin-top:14px}.s small{display:block;font-size:15px;color:#5F645F;font-weight:500}
.card{margin:14px 16px 0;background:#fff;border-radius:22px;padding:18px}
.t{font-size:13px;color:#5F645F;font-weight:600}
.h{font-size:22px;font-weight:700;margin:4px 0 14px}
.btn{width:100%;height:52px;border-radius:26px;border:0;background:#2E8B4A;color:#fff;font-size:17px;font-weight:600}
.wk{display:flex;justify-content:space-between;margin-top:14px}.wk i{width:32px;height:32px;border-radius:50%;background:#E5E8E5}.wk i.f{background:#2E8B4A}
.tabs{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(249,249,249,.9);border-top:.5px solid #C6C6C8;display:flex;justify-content:space-around;padding-top:12px}
.tabs i{width:26px;height:26px;border-radius:6px;background:#C7C7CC}.tabs i.on{background:#2E8B4A}
</style></head><body>
<div class="lt">Today</div>
<div class="hero"><div class="disc"><svg width="120" height="150" viewBox="0 0 120 150"><rect x="56" y="80" width="8" height="70" rx="4" fill="#8B6B4A"/><circle cx="60" cy="60" r="44" fill="#2E8B4A"/><circle cx="40" cy="74" r="26" fill="#56C173"/></svg></div><div class="s">3 days<small>Next: a full week · 3 of 7</small></div></div>
<div class="card"><div class="t">Day 9 of 21</div><div class="h">11 min suggested</div><button class="btn">Begin</button>
<div class="wk"><i class="f"></i><i class="f"></i><i></i><i></i><i class="f"></i><i class="f"></i><i></i></div></div>
<div class="tabs"><i class="on"></i><i></i><i></i><i></i></div>
</body></html>
