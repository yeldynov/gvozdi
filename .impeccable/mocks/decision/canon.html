<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F2F2F7;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:#000}
.lt{font-size:34px;font-weight:700;padding:60px 20px 12px;display:flex;justify-content:space-between;align-items:center}
.lt i{width:28px;height:28px;border-radius:50%;background:#E5E5EA}
.card{background:#fff;border-radius:14px;margin:0 16px 20px;padding:20px;display:flex;align-items:center;gap:20px}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(#34A853 0 0%,#E5E5EA 0);display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#fff}
.ring span{position:relative;z-index:1;font-size:28px;font-weight:700;text-align:center;line-height:1}.ring small{display:block;font-size:13px;color:#8E8E93;font-weight:500}
.t{font-size:13px;color:#8E8E93;font-weight:600;text-transform:uppercase}
.h{font-size:22px;font-weight:700;margin:4px 0 12px}
.btn{height:50px;border-radius:12px;background:#34A853;color:#fff;font-size:17px;font-weight:600;border:0;width:100%}
.hdr{font-size:13px;color:#8E8E93;text-transform:uppercase;padding:0 36px 6px}
.list{background:#fff;border-radius:14px;margin:0 16px 20px}
.r{display:flex;justify-content:space-between;align-items:center;padding:0 16px;height:52px;font-size:17px}
.r+.r{border-top:.5px solid #C6C6C8;margin-left:16px;padding-left:0}
.r b{font-weight:400;color:#8E8E93}
.tabs{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(249,249,249,.9);border-top:.5px solid #C6C6C8;display:flex;justify-content:space-around;padding-top:12px}
.tabs i{width:26px;height:26px;border-radius:6px;background:#C7C7CC}.tabs i.on{background:#34A853}
</style></head><body>
<div class="lt">Today<i></i></div>
<div class="card">
  <div class="ring"><span>0<small>of 11 min</small></span></div>
  <div style="flex:1"><div class="t">Day 9 of 21</div><div class="h">11 min suggested</div><button class="btn">Begin</button></div>
</div>
<div class="hdr">Streak</div>
<div class="list"><div class="r">Current streak<b>3 days</b></div><div class="r">Next milestone<b>A full week · 3/7</b></div></div>
<div class="hdr">This week</div>
<div class="list"><div class="r">Minutes<b>46</b></div><div class="r">Sessions<b>4</b></div></div>
<div class="tabs"><i class="on"></i><i></i><i></i><i></i></div>
</body></html>
